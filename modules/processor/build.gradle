plugins {
    id 'io.kotest' version '6.2.7'
}

kotest {
    customGradleTask = true
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}


kotlin {
    jvmToolchain(25)
}

configurations {
    shade
    implementation.extendsFrom(shade)
    testImplementation.extendsFrom annotationProcessor
}

dependencies {
    implementation project(':annotations')
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    kapt 'com.google.auto.service:auto-service:1.1.1'

    testRuntimeOnly project(':annotations')
    testImplementation 'io.kotest:kotest-framework-engine:6.2.7'
    testImplementation 'io.kotest:kotest-assertions-core:6.2.7'
    testImplementation "dev.zacsweers.kctfork:core:0.14.0"
    testImplementation "io.mockk:mockk:1.14.5"
}

var args = [
        "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
]

tasks.withType(Test).configureEach {
    jvmArgs(args)
    // Kotest specs run through the kotest task, so Gradle 9 must not fail the JUnit test task for finding none.
    failOnNoDiscoveredTests = false
}

tasks.named('jvmKotest') {
    jvmArgs(args)
}

tasks.named('check') {
    dependsOn 'jvmKotest'
}

